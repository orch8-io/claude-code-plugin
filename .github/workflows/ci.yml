name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.283

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Manifests, .mcp.json and SKILL.md frontmatter
        run: node scripts/validate.mjs
      - name: Install Claude Code CLI (no login needed for plugin validate)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: claude plugin validate (marketplace)
        run: claude plugin validate .
      - name: claude plugin validate --strict (plugin)
        run: claude plugin validate --strict .claude-plugin/plugin.json
